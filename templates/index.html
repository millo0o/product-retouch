<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 사진 보정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 1번 디자인(소프트 미니멀) · 배치·크기·색은 GPT 제안(2026-11-24) 그대로 */
:root{
  --bg:#F6F6F6; --card:#FFFFFF; --ink:#242424; --sub:#707070; --line:#E2E2E2; --row:#E6E6E6;
  --accent:#4F78B5; --wash:#EEF2FA; --pillbg:#F1F1F1; --seg:#F3F3F3;
  --shadow:0 2px 10px rgba(0,0,0,.045);
  --ko:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 0 64px}
@media (max-width:1240px){.wrap{padding:0 20px 64px}}

.hdr{height:64px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em}
.hdr .note{font-size:14px;color:var(--sub)}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:24px}

/* 사진 올리기 */
.drop{border:1px dashed #D5D5D5;border-radius:20px;background:var(--card);min-height:152px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:background .15s,border-color .15s;margin-top:8px}
.drop.empty{min-height:280px}
.drop.over{background:var(--wash);border-color:var(--accent)}
.drop .t{font-size:16px;font-weight:600}
.drop .s{font-size:14px;color:var(--sub)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:#FAFAFA}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#456CA6}
.modes{display:flex;gap:8px;justify-content:center}
.mode{height:36px;padding:0 12px;border-radius:6px;border:1px solid #D9D9D9;background:#fff;color:#555555;font-size:14px;cursor:pointer}
.mode.on{background:#EEF3FA;border-color:#4A6FA5;color:#365780}
.drop .mdesc{font-size:12px;color:#777777}
.qb{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:4px;font-size:12px}
.qb.fast{background:#F2F2F2;color:#666666}
.qb.deep{background:#EEF3FA;color:#365780}
.dls .deepbtn{margin-left:auto;height:44px;padding:0 16px;border-radius:8px;border:0;background:#4A6FA5;color:#fff;font-size:14px;font-weight:700}
.dls .deepbtn:hover{background:#456CA6}
.deepnote{font-size:12px;color:#777777;text-align:right;margin-top:6px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:default;pointer-events:none}
.tbtn{background:none;border:0;padding:0;min-height:44px;font-size:14px;color:var(--sub);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tbtn:hover{color:var(--ink)}

/* 작업 영역 */
.work{display:grid;grid-template-columns:384px minmax(0,1fr);gap:32px;margin-top:32px;align-items:start}
.work[hidden]{display:none}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.listhead h2{margin:0;font-size:24px;font-weight:600}
.counts{font-size:14px;color:var(--sub)}
.list{display:flex;flex-direction:column}
.row{min-height:96px;display:grid;grid-template-columns:20px 64px minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px;border-radius:12px;border-bottom:1px solid var(--row);cursor:pointer}
.row input,.row .thumb{align-self:center}
.row .rm{grid-column:3;justify-self:start;min-height:32px}
.row:last-child{border-bottom:0}
.row.sel{background:var(--wash);border-bottom-color:transparent}
.row input{width:20px;height:20px;border-radius:4px;accent-color:var(--accent);margin:0;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid #E2E2E2;object-fit:cover;background:#F7F7F7;display:block}
.rname{font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.rsub{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:6px;min-width:0}
.rstep{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.rm{font-size:14px}

.pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;font-size:14px;white-space:nowrap;flex:none}
.p-wait{color:#707070;background:#F1F1F1;font-weight:400}
.p-run{color:var(--accent);background:var(--wash);font-weight:600}
.p-done{color:#404040;background:#F1F1F1;font-weight:500}
.p-fail{color:#171717;background:#EEEEEE;font-weight:700}

.zip{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
.zip h3,.sec h3{margin:0 0 12px;font-size:16px;font-weight:600}
.radio,.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer}
.radio input,.check input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.zipnote{font-size:14px;color:var(--sub);margin:8px 0 12px}
.zip .btn{width:100%}

/* 결과 */
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.rhead h2{margin:0;font-size:24px;font-weight:600;word-break:break-all}
.seg{display:grid;grid-template-columns:repeat(3,1fr);height:44px;background:var(--seg);border-radius:10px;padding:4px;margin-top:20px}
.seg button{border:0;background:none;border-radius:8px;font-size:16px;cursor:pointer;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg button:disabled{opacity:.4;cursor:default}
.view{margin:20px auto 0;width:100%;max-width:480px;aspect-ratio:1;border-radius:16px;border:1px solid #E2E2E2;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.view img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.view.checker{background-color:#fff;background-image:linear-gradient(45deg,#ECECEC 25%,transparent 25%),linear-gradient(-45deg,#ECECEC 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ECECEC 75%),linear-gradient(-45deg,transparent 75%,#ECECEC 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.view .wait{font-size:14px;color:var(--sub);padding:24px;text-align:center}
.cmpbtn{display:block;margin:8px auto 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cmp figure{margin:0}
.cmp figcaption{font-size:14px;color:var(--sub);margin-bottom:6px}
.cmp img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:16px;border:1px solid #E2E2E2;background:#fff;display:block;cursor:zoom-in}
.dls{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

.sec{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:24px 140px minmax(0,1fr);gap:8px;align-items:baseline;min-height:32px;font-size:14px}
.steps .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #C9C9C9;display:inline-block;transform:translateY(1px)}
.steps li.run .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.6s ease-out infinite}
.steps li.done .dot{border-color:#404040;background:#404040}
.steps li.fail .dot{border-color:#171717;background:#fff;box-shadow:inset 0 0 0 2px #171717}
.steps li.skip .dot{border-style:dashed}
.steps .lb{font-size:14px;color:var(--ink)}
.steps li.run .lb{color:var(--accent);font-weight:600}
.steps li.fail .lb{font-weight:700;color:#171717}
.steps .dt{color:var(--sub)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,120,181,.45)}70%{box-shadow:0 0 0 7px rgba(79,120,181,0)}100%{box-shadow:0 0 0 0 rgba(79,120,181,0)}}
.meta{font-size:14px;color:var(--sub);margin-top:8px}

.tsum{font-size:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.need{font-weight:700;color:#171717}
.tlines{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl{display:grid;grid-template-columns:40px minmax(0,1fr) 64px;gap:8px;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--row);align-items:baseline}
.tl:last-child{border-bottom:0}
.tl .n{color:var(--sub)}
.tl.bad{font-weight:700;color:#171717}
.tl .st{text-align:right;color:var(--sub)}
.tl.bad .st{color:#171717}
.tl b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.unsure{font-size:14px;color:var(--sub);margin-top:10px}
.sheets{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.sheets img{width:100%;border:1px solid var(--line);border-radius:12px;display:block;cursor:zoom-in;background:#fff}
.zoom.on{overflow:auto}
.zoom.sheet{align-items:flex-start;justify-content:center}
.zoom.sheet img{max-width:min(1800px,100%);max-height:none}

.actions{display:flex;gap:12px;flex-wrap:wrap}

/* 크게 보기 */
.zoom{position:fixed;inset:0;background:rgba(246,246,246,.96);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:24px}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;box-shadow:var(--shadow);background:#fff}

@media (max-width:900px){
  .wrap{padding:0 16px 48px}
  .hdr h1{font-size:24px}
  .drop{height:160px}
  .work{grid-template-columns:minmax(0,1fr);gap:24px}
  .list{max-height:288px;overflow:auto}
  .card{padding:16px}
  .cmp{grid-template-columns:1fr}
  .dls .btn,.actions .btn{width:100%}
  .leftcol{display:contents}
  .listcard{order:1}.resultcard{order:2}.zipcard{order:3}
  .steps li{grid-template-columns:24px minmax(0,1fr)}
  .steps .dt{grid-column:2}
  .tl{grid-template-columns:32px minmax(0,1fr)}
  .tl .st{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>제품 사진 보정·누끼</h1>
    <span class="note" id="live">연결 중…</span>
  </header>

  <label class="drop empty" id="drop">
    <span class="t">사진을 끌어다 놓으세요</span>
    <span class="s">여러 장을 한 번에 선택할 수 있습니다.</span>
    <span class="modes" role="radiogroup" aria-label="보정 방식"><button type="button" class="mode on" data-mode="fast" role="radio" aria-checked="true">빠른 보정 · 약 3~4분</button><button type="button" class="mode" data-mode="deep" role="radio" aria-checked="false">꼼꼼 보정 · 약 8~12분</button></span>
    <span class="mdesc" id="mdesc">AI 보정 1회 후 글씨를 검사합니다. 틀린 글씨는 표시만 합니다.</span>
    <span class="btn primary" role="button">사진 선택</span>
    <span class="s">올리면 선택한 방식으로 보정을 시작합니다.</span>
    <input type="file" id="file" accept="image/*,.heic,.HEIC" multiple hidden>
  </label>

  <section class="work" id="work" hidden>
    <div class="leftcol">
      <div class="card listcard">
        <div class="listhead"><h2 id="cnt">사진</h2></div>
        <div class="counts num" id="counts"></div>
        <div class="list" id="list"></div>
      </div>
      <div class="card zipcard" style="margin-top:24px">
        <div class="zip" style="margin:0;border:0;padding:0">
          <h3>ZIP으로 한 번에 받기</h3>
          <label class="radio"><input type="radio" name="tgt" value="sel" checked> <span id="tsel">선택한 사진 0장</span></label>
          <label class="radio"><input type="radio" name="tgt" value="all"> <span id="tall">전체 사진 0장</span></label>
          <label class="check"><input type="checkbox" class="kind" value="retouched" checked> 보정본 (흰 배경 PNG)</label>
          <label class="check"><input type="checkbox" class="kind" value="cutout" checked> 누끼 PNG (투명)</label>
          <div class="zipnote num" id="zipnote"></div>
          <a class="btn primary" id="zipbtn">ZIP 받기</a>
        </div>
      </div>
    </div>

    <div class="card resultcard" id="result"></div>
  </section>
</div>
<div class="zoom" id="zoom"><img alt=""></div>

<script>
const $ = s => document.querySelector(s);
let JOBS = [], SEL = null, TAB = 'retouched', CMP = false, OPEN_TEXT = false;
const checked = new Set();
const enc = s => encodeURIComponent(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pillCls = {'대기':'p-wait','보정 중':'p-run','완료':'p-done','실패':'p-fail'};
const file = (j, f) => `/files/${j.id}/${f.split('/').map(enc).join('/')}`;

// ---- 올리기 ----
const drop = $('#drop'), input = $('#file');
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
let MODE = 'fast';
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', ev => {
  ev.preventDefault(); ev.stopPropagation(); MODE = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
  $('#mdesc').textContent = MODE === 'fast' ? 'AI 보정 1회 후 글씨를 검사합니다. 틀린 글씨는 표시만 합니다.' : '라벨을 다시 그리고 틀린 낱말까지 고칩니다.';
}));
const qual = j => j.quality === 'fast' ? 'fast' : 'deep';
drop.addEventListener('drop', ev => upload([...ev.dataTransfer.files]));
input.addEventListener('change', () => { upload([...input.files]); input.value = ''; });
async function upload(files) {
  for (const f of files.filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name))) {
    const r = await fetch('/api/upload', {method: 'POST', headers: {'X-Name': enc(f.name), 'X-Mode': MODE}, body: f});
    if (r.ok) { const j = await r.json(); if (!SEL) SEL = j.id; }
  }
  refresh();
}

// ---- 목록 ----
function stepNow(j) {
  const st = j.report?.steps || [];
  const run = st.find(s => s.state === '진행');
  if (j.status === '보정 중') return run ? run.label : '준비 중';
  if (j.status === '완료') { const t = j.report?.text; if (!t?.total) return '보정 끝';
    const b = (t.lines || []).filter(l => /□/.test(l.text)).length, ok = (t.lines || []).filter(l => l.ok && !/□/.test(l.text)).length;
    return `글씨 ${t.total - b}줄 중 ${ok}줄 그대로`; }
  if (j.status === '실패') return j.message || '실패';
  return '순서 기다리는 중';
}
function renderList() {
  const n = c => JOBS.filter(j => j.status === c).length;
  $('#cnt').textContent = `사진 ${JOBS.length}장`;
  $('#counts').textContent = `완료 ${n('완료')} · 보정 중 ${n('보정 중')} · 대기 ${n('대기')} · 실패 ${n('실패')}`;
  $('#list').innerHTML = JOBS.map(j => `
    <div class="row ${j.id === SEL ? 'sel' : ''}" data-id="${j.id}">
      <input type="checkbox" data-ck="${j.id}" ${checked.has(j.id) ? 'checked' : ''} aria-label="ZIP에 넣기">
      <img class="thumb" src="${j.report?.outputs?.original ? file(j, j.report.outputs.original) : ''}" alt="" onerror="this.style.visibility='hidden'">
      <div style="min-width:0">
        <div class="rname">${esc(j.name)}</div>
        <div class="rsub"><span class="pill ${pillCls[j.status]}">${j.status}</span><span class="qb ${qual(j)}">${qual(j)==='fast'?'빠른 보정':'꼼꼼 보정'}</span><span class="rstep">${esc(stepNow(j))}</span></div>
      </div>
      <span></span><span></span><button class="tbtn rm" data-rm="${j.id}">목록에서 빼기</button>
    </div>`).join('');
}
$('#list').addEventListener('click', e => {
  const ck = e.target.dataset.ck, rm = e.target.dataset.rm;
  if (ck) { e.target.checked ? checked.add(ck) : checked.delete(ck); renderZip(); return; }
  if (rm) { if (confirm('이 사진을 목록에서 뺄까요? (파일은 작업 폴더의 _휴지통으로 옮겨져요)')) fetch('/api/remove?id=' + rm, {method: 'POST'}).then(refresh); return; }
  const row = e.target.closest('.row'); if (row) { SEL = row.dataset.id; CMP = false; OPEN_TEXT = false; render(); }
});

// ---- ZIP ----
function renderZip() {
  const done = JOBS.filter(j => j.status === '완료');
  $('#tsel').textContent = `선택한 사진 ${checked.size}장`;
  $('#tall').textContent = `전체 사진 ${JOBS.length}장`;
  const all = document.querySelector('input[name=tgt]:checked').value === 'all';
  const tgt = all ? JOBS : JOBS.filter(j => checked.has(j.id));
  const ok = tgt.filter(j => j.status === '완료');
  const kinds = [...document.querySelectorAll('.kind:checked')].map(k => k.value);
  $('#zipnote').textContent = tgt.length === 0 ? '받을 사진을 체크하거나 전체를 고르세요.'
    : `완료된 ${ok.length}장 포함` + (tgt.length > ok.length ? ` · 대기/보정 중/실패 ${tgt.length - ok.length}장 제외` : '');
  const b = $('#zipbtn');
  b.setAttribute('aria-disabled', !(ok.length && kinds.length));
  b.href = `/api/zip?ids=${ok.map(j => j.id).join(',')}&kinds=${kinds.join(',')}`;
}
document.querySelectorAll('input[name=tgt],.kind').forEach(i => i.addEventListener('change', renderZip));

// ---- 결과 ----
function renderResult() {
  const j = JOBS.find(x => x.id === SEL) || JOBS[0];
  const box = $('#result');
  if (!j) { box.innerHTML = ''; return; }
  SEL = j.id;
  const rp = j.report || {}, o = rp.outputs || {}, done = j.status === '완료';
  const imgs = {original: o.original, retouched: o.previewRetouched, cutout: o.previewCutout};
  if (!imgs[TAB]) TAB = imgs.retouched ? 'retouched' : 'original';
  // 진행 중이면 가장 최근 단계 그림을 보정본 자리에 보여줌
  const last = (rp.versions || []).slice(-1)[0];
  const showRet = imgs.retouched || last?.file;
  const src = TAB === 'retouched' ? showRet : imgs[TAB];
  const stCls = {'진행':'run','완료':'done','실패':'fail','건너뜀':'skip'};
  const t = rp.text;
  box.innerHTML = `
    <div class="rhead"><h2>${esc(j.name)}</h2><span class="pill ${pillCls[j.status]}">${j.status}</span></div>
    <div class="seg" role="tablist">
      <button class="${TAB==='original'?'on':''}" data-tab="original" ${imgs.original?'':'disabled'}>원본</button>
      <button class="${TAB==='retouched'?'on':''}" data-tab="retouched" ${showRet?'':'disabled'}>보정본</button>
      <button class="${TAB==='cutout'?'on':''}" data-tab="cutout" ${imgs.cutout?'':'disabled'}>누끼</button>
    </div>
    <div class="view ${TAB==='cutout'?'checker':''}">
      ${src ? `<img src="${file(j, src)}" alt="" data-zoom>` : `<div class="wait">${j.status==='대기'?'순서를 기다리고 있어요':'보정본을 만드는 중이에요'}</div>`}
    </div>
    ${TAB==='retouched' && !imgs.retouched && last ? `<div class="meta" style="text-align:center">지금 단계 그림: ${esc(last.label)} (아직 끝나지 않았어요)</div>` : ''}
    ${imgs.original && showRet ? `<button class="tbtn cmpbtn" id="cmpbtn">${CMP ? '비교 닫기' : '원본·보정본 비교 보기'}</button>` : ''}
    ${CMP && imgs.original && showRet ? `<div class="cmp"><figure><figcaption>원본</figcaption><img src="${file(j, imgs.original)}" alt="원본" data-zoom></figure><figure><figcaption>보정본</figcaption><img src="${file(j, showRet)}" alt="보정본" data-zoom></figure></div>` : ''}
    <div class="dls">
      <a class="btn" ${done?`href="${file(j, o.retouched)}?dl=1"`:'aria-disabled="true"'}>보정본 받기</a>
      <a class="btn" ${done&&o.cutout?`href="${file(j, o.cutout)}?dl=1"`:'aria-disabled="true"'}>누끼 받기</a>
      ${done && qual(j)==='fast' ? `<button class="deepbtn" id="deepbtn">꼼꼼 보정하기</button>` : (qual(j)==='deep' && (j.status==='보정 중'||j.status==='대기') && j.deepFrom ? `<button class="deepbtn" disabled>꼼꼼 보정 중</button>` : '')}
    </div>
    ${done && qual(j)==='fast' ? `<div class="deepnote">현재 빠른 보정본에서 이어서 라벨과 틀린 낱말을 고칩니다.</div>` : ''}

    <div class="sec">
      <h3>진행</h3>
      <ul class="steps">${(rp.steps || []).map(s => `<li class="${stCls[s.state]||''}"><span class="dot"></span><span class="lb">${esc(s.label)}</span><span class="dt">${esc(s.detail || s.state)}</span></li>`).join('') || '<li><span class="dot"></span><span class="lb">대기</span><span class="dt">순서를 기다리고 있어요</span></li>'}</ul>
      <div class="meta num">${rp.elapsed ? `걸린 시간 ${Math.floor(rp.elapsed/60)}분 ${rp.elapsed%60}초 · GPT ${rp.gpt}번 사용` : ''}${o.size ? ` · 보정본 ${o.size[0]}×${o.size[1]}` : ''}</div>
      ${j.status==='실패' ? `<p class="need">실패: ${esc(j.message || rp.error || '')}</p>` : ''}
    </div>

    ${t && t.total ? `
    <div class="sec">
      <h3>글씨 확인</h3>
      ${(() => { const blur = t.lines.filter(l => /□/.test(l.text)).length, tot = t.total - blur, ok = t.lines.filter(l => l.ok && !/□/.test(l.text)).length;
        return `<div class="tsum num">글씨 ${tot}줄 중 ${ok}줄 그대로 ${ok < tot ? '<span class="need">확인 필요</span>' : ''}</div>${blur ? `<div class="meta" style="margin-top:2px">원본이 너무 작아 못 읽은 ${blur}줄은 눈으로 확인해 주세요.</div>` : ''}`; })()}
      ${t.fixed?.length ? `<div class="meta">자동으로 고친 낱말: ${t.fixed.map(esc).join(', ')}</div>` : ''}
      ${t.extra?.length ? `<div class="need" style="font-size:14px;margin-top:6px">원본보다 더 많이 나온 낱말: ${t.extra.map(esc).join(', ')}</div>` : ''}
      <button class="tbtn" id="tbtn">${OPEN_TEXT ? '줄별 텍스트 닫기' : '줄별 텍스트 보기'}</button>
      ${OPEN_TEXT ? `<div class="tlines">${t.lines.map((l, i) => {
        let tx = esc(l.text); (l.wrong || []).forEach(w => { tx = tx.split(esc(w)).join(`<b>${esc(w)}</b>`); });
        const blur = /□/.test(l.text);
        return `<div class="tl ${l.ok && !blur ? '' : 'bad'}"><span class="n num">${i + 1}</span><span>${blur ? '원본 사진에서 너무 작아 읽지 못한 글씨 (마크 속 작은 글씨 등)' : tx}</span><span class="st">${blur ? '눈으로 확인' : l.ok ? '같음' : '다름'}</span></div>`; }).join('')}</div>
        ${t.unsure?.length ? `<div class="unsure">원본 사진에서도 기계가 똑같이 읽지 못해 자동 확인을 못 한 낱말 ${t.unsure.length}개: ${t.unsure.slice(0, 30).map(esc).join(', ')}${t.unsure.length > 30 ? ' …' : ''} — 눈으로 한 번 봐 주세요.</div>` : ''}
        ${t.sheets?.length ? `<h3 style="margin-top:20px">원본·보정본 줄 맞대기</h3><div class="meta" style="margin-top:0">쌍마다 위가 원본 사진, 아래가 보정본이에요. 눌러서 크게 볼 수 있어요.</div>
          <div class="sheets">${t.sheets.map(f => `<img src="${file(j, f)}" alt="줄 비교표" data-zoom>`).join('')}</div>` : ''}` : ''}
    </div>` : ''}

    <div class="sec">
      <h3>다시 하기</h3>
      <div class="actions">
        <button class="btn" id="retryfix" ${j.status!=='완료'?'disabled':''}>글씨만 다시 검사·고치기</button>
        <button class="btn" id="retry" ${j.status==='보정 중'||j.status==='대기'?'disabled':''}>이 사진 처음부터 다시 하기</button>
      </div>
      <div class="meta">글씨만 다시 하기는 지금 보정본을 그대로 두고 틀린 낱말만 다시 찾아 고쳐요 (2~4분).</div>
    </div>`;
}
$('#result').addEventListener('click', e => {
  const tab = e.target.dataset.tab;
  if (tab) { TAB = tab; renderResult(); return; }
  if (e.target.id === 'cmpbtn') { CMP = !CMP; renderResult(); return; }
  if (e.target.id === 'tbtn') { OPEN_TEXT = !OPEN_TEXT; renderResult(); return; }
  if (e.target.id === 'deepbtn') { e.target.disabled = true; e.target.textContent = '꼼꼼 보정 중'; fetch('/api/retry?mode=deep&id=' + SEL, {method: 'POST'}).then(refresh); return; }
  if (e.target.id === 'retryfix') { fetch('/api/retry?mode=fix&id=' + SEL, {method: 'POST'}).then(refresh); return; }
  if (e.target.id === 'retry') { fetch('/api/retry?id=' + SEL, {method: 'POST'}).then(refresh); return; }
  if (e.target.dataset.zoom !== undefined) { const z = $('#zoom'); z.querySelector('img').src = e.target.src; z.classList.toggle('sheet', !!e.target.closest('.sheets')); z.classList.add('on'); z.scrollTop = 0; }
});
$('#zoom').addEventListener('click', () => $('#zoom').classList.remove('on'));

// ---- 갱신 (1초마다) ----
let lastSig = '';
function render() {
  const has = JOBS.length > 0;
  drop.classList.toggle('empty', !has);
  $('#work').hidden = !has;
  renderList(); renderZip(); renderResult();
}
async function refresh() {
  try {
    const r = await fetch('/api/jobs', {cache: 'no-store'}); const d = await r.json();
    JOBS = d.jobs;
    $('#live').textContent = d.queue || JOBS.some(j => j.status === '보정 중') ? '보정하는 중 · 1초마다 갱신' : '대기 중';
    const sig = JSON.stringify(JOBS);
    if (sig !== lastSig) { lastSig = sig; render(); }
  } catch (e) { $('#live').textContent = '서버 연결 끊김'; }
}
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
